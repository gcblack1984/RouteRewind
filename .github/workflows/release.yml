name: Release

# Si avvia in due modi:
#  - pubblicando un tag di versione, es.:  git tag v1.0.1 && git push origin v1.0.1
#  - a mano da Actions > Release > Run workflow, indicando un tag già esistente
#    (ricostruisce exe e MSIX dal ramo principale e li allega a quella release)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release a cui allegare i file (es. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Versione del pacchetto dal tag
        shell: pwsh
        run: |
          $parts = "$env:TAG".TrimStart('v').Split('.') | ForEach-Object { [int]($_ -replace '\D','') }
          while ($parts.Count -lt 3) { $parts += 0 }
          $ver = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $m = 'packaging\AppxManifest.xml'
          (Get-Content $m -Raw) -creplace '(?<=\s)Version="[\d.]+"', "Version=`"$ver`"" | Set-Content $m -NoNewline
          Write-Host "Versione MSIX: $ver"
          Select-String -Path $m -Pattern 'Version='

      - name: Build exe
        shell: cmd
        run: call build.bat

      - name: Comprimi l'exe
        shell: pwsh
        run: Compress-Archive -Path dist\RouteRewind -DestinationPath "RouteRewind-$env:TAG-windows-x64.zip"

      - name: Controlla i nomi dei file del pacchetto
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist\RouteRewind -Recurse -File | Where-Object { $_.FullName.Substring((Resolve-Path dist\RouteRewind).Path.Length) -notmatch '^[A-Za-z0-9._\\-]+$' }
          Write-Host "File totali:" (Get-ChildItem dist\RouteRewind -Recurse -File).Count
          if ($bad) { Write-Host "Nomi con caratteri particolari:"; $bad | ForEach-Object { Write-Host $_.FullName } }

      - name: Crea il pacchetto MSIX
        shell: cmd
        run: |
          call make_msix.bat || exit /b 1
          move dist\RouteRewind.msix "RouteRewind-%TAG%-x64.msix"

      - name: Diagnostica MSIX (solo se la creazione fallisce)
        if: failure()
        shell: pwsh
        run: |
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object FullName -match '\\x64\\' | Select-Object -Last 1
          python tools\find_bad_msix_file.py $mk.FullName dist\RouteRewind

      - name: Pubblica la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            RouteRewind-${{ env.TAG }}-windows-x64.zip
            RouteRewind-${{ env.TAG }}-x64.msix
          generate_release_notes: true
