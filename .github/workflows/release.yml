name: Release

# Si avvia pubblicando un tag di versione, es.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build exe
        shell: cmd
        run: call build.bat
      - name: Comprimi
        shell: pwsh
        run: Compress-Archive -Path dist\RouteRewind -DestinationPath "RouteRewind-${{ github.ref_name }}-windows-x64.zip"
      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          files: RouteRewind-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
